name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::088332244230:role/github-actions-yasu-portfolio-deploy
          aws-region: ap-northeast-1

      - name: Sync to S3
        run: |
          aws s3 sync . s3://yasu-portfolio \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".DS_Store" \
            --exclude "lambda_function.py" \
            --exclude "CLAUDE.md" \
            --exclude "README.md" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E8W661LVRSS1N \
            --paths "/*"
